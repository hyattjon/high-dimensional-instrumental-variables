[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "weak_instruments"
version = "0.1.2"
authors = [
  { name="Jonathan Hyatt", email="hyatt.jonathan99@gmail.com" },
  { name="Jacob Hutchings", email="jacobhutchings1@gmail.com" }
]
description = "Jackknife IV estimators (JIVE1, JIVE2, UJIVE1, UJIVE2) for instrumental variables regression with many instruments."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.21",
    "scipy>=1.7",
    "pandas",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

license = "MIT"
license-files = ["LICENSE*"]

[project.urls]
Homepage = "https://github.com/hyattjon/weak_instruments"
Issues = "https://github.com/hyattjon/weak_instruments/issues"

[project.optional-dependencies]
docs = ["sphinx>=8.0"]
test = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
